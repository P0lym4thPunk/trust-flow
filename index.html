    <script>
      (function() {
        try {
          var _fetch = window.fetch;
          var proto = Window.prototype;
          // Provide both getter and setter on Window.prototype and window
          // so extensions assigning window.fetch = ... can succeed without throwing
          Object.defineProperty(proto, 'fetch', {
            get: function() { return _fetch; },
            set: function(val) { _fetch = val; },
            configurable: true,
            enumerable: true
          });
          Object.defineProperty(window, 'fetch', {
            get: function() { return _fetch; },
            set: function(val) { _fetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}
      })();
    </script>
